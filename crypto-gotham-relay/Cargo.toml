[package]
name = "crypto-gotham-relay"
version = "0.12.1"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-Gotham-Commercial"
description = "Standalone Gotham mixnet relay daemon"
authors = ["0x9Angel"]

[[bin]]
name = "gotham-relay"
path = "src/main.rs"

[dependencies]
crypto-gotham = { path = "../crypto-gotham" }
crypto-gotham-directory = { path = "../crypto-gotham-directory" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }

clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }

thiserror = "1"

igd-next = { version = "0.15", features = ["aio_tokio"] }

quinn = "0.11"
snow = "0.9"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures = "0.3"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "test-util"] }

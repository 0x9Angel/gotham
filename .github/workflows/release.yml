# Relay + authority binaries for the Gotham network.
#
# This lives in the PUBLIC repository on purpose. GitHub bills Actions minutes
# for private repositories only — public ones are unmetered — and macOS runners
# bill at 10x, Windows at 2x. Building the relay here instead of alongside the
# proprietary application removes roughly half the private-repo minute cost of a
# release, at no loss: this code is published anyway.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach binaries to'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            cross: true
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
          # macos-13 (Intel) is deliberately absent: GitHub's Intel macOS runners
          # queue for hours, and one stuck leg would strand the whole release.
          # Apple Silicon covers modern Macs.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cross (aarch64 Linux only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build relay + authority
        shell: bash
        run: |
          BIN="cargo"
          [ "${{ matrix.cross }}" = "true" ] && BIN="cross"
          $BIN build --release --target ${{ matrix.target }} \
            -p crypto-gotham-relay --bin gotham-relay
          $BIN build --release --target ${{ matrix.target }} \
            -p crypto-gotham-authority --bin gotham-directory-authority

      - name: Package + checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          for b in gotham-relay gotham-directory-authority; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$b-${{ matrix.label }}"
          done
          cd dist
          # Publish checksums so an operator can verify a downloaded relay
          # against something other than "it came from the right URL".
          shasum -a 256 * > "SHA256SUMS-${{ matrix.label }}.txt"

      - name: Package + checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($b in @('gotham-relay','gotham-directory-authority')) {
            Copy-Item "target/${{ matrix.target }}/release/$b.exe" "dist/$b-${{ matrix.label }}.exe"
          }
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "dist/SHA256SUMS-${{ matrix.label }}.txt"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true

[package]
name = "crypto-gotham-directory"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-Gotham-Commercial"
description = "CRDT-style gossip directory for self-organising Gotham mixnets (Option D Chantier 3)"

[dependencies]
crypto-gotham = { path = "../crypto-gotham" }

# Crypto primitives
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"

# Serialisation — JSON for disk + wire format
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hex encoding
hex = "0.4"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Errors
thiserror = "1"

# Async (for the gossip task — TODO)
tokio = { version = "1", features = ["rt", "sync", "time"] }

# Tracing
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
rand = "0.8"
